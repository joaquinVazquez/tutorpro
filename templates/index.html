<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor de programación básica</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
    #chat { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 10px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
    .usuario { background: #dbeafe; text-align: right; }
    .tutor { background: #f3f4f6; }
    form { display: flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 10px; }
    button { padding: 10px 16px; }
  </style>
</head>
<body>
  <h1>Tutor de programación básica</h1>
  <p>Pregunta sobre variables, condicionales, bucles o funciones.</p>

  <div id="chat"></div>

  <form id="formulario">
    <input id="pregunta" type="text" placeholder="Escribe tu duda..." maxlength="500" autocomplete="off">
    <button type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const formulario = document.getElementById("formulario");
    const campo = document.getElementById("pregunta");

    function agregarMensaje(texto, clase) {
      const div = document.createElement("div");
      div.className = "msg " + clase;
      div.textContent = texto;  // textContent evita insertar HTML
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const pregunta = campo.value.trim();
      if (!pregunta) return;

      agregarMensaje(pregunta, "usuario");
      campo.value = "";
      const espera = agregarMensaje("Pensando...", "tutor");

      try {
        const respuesta = await fetch("/preguntar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pregunta })
        });
        const datos = await respuesta.json();
        espera.textContent = datos.respuesta || datos.error;
      } catch (error) {
        espera.textContent = "Error de conexión con el servidor.";
      }
    });
  </script>
</body>
</html>
